<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Kit</title>

    <style>
      body {
        margin: 0;
        background: linear-gradient(#f69d3c, #3f87a6);
        height: 100vh;
        overflow: hidden;
        position: relative;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Music notes bg */
      .music-notes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.25;
        pointer-events: none;
      }
      .music-note {
        position: absolute;
        font-size: 2rem;
        color: rgba(255,255,255,0.6);
        animation: float 4s infinite ease-in-out;
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }

      h1 {
        text-align: center;
        margin-top: 2rem;
        font-size: 6rem;
        color: white;
        text-shadow: 3px 3px 5px rgba(0,0,0,0.3);
        margin-bottom: 8rem;
      }

      .set {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        margin-top: 80px;
        z-index: 3;
        position: relative;
      }

      .beat {
        height: 150px;
        width: 150px;
        border-radius: 8px;
        background-size: cover;
        background-position: center;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        transition: 0.2s ease;
        font-size: 5rem;
        font-weight: bold;
        color: #3f87a6;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .beat:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 20px rgba(0,0,0,0.3);
      }

      .animate {
        animation: clickAnim 0.2s ease;
      }

      @keyframes clickAnim {
        0% { transform: scale(1); }
        50% { transform: scale(0.75); box-shadow: 0 0 20px 10px rgba(255,255,255,0.7); }
        100% { transform: scale(1); }
      }
    </style>
  </head>

  <body>

    <!-- Background floating notes -->
    <div class="music-notes">
      <div class="music-note" style="top:10%; left:20%;">♪</div>
      <div class="music-note" style="top:30%; left:80%;">♫</div>
      <div class="music-note" style="top:60%; left:10%;">♪</div>
      <div class="music-note" style="top:70%; left:85%;">♫</div>
      <div class="music-note" style="top:40%; left:50%;">♪</div>
    </div>

    <h1>Drum 🥁 Kit</h1>

    <div class="set">
      <button class="beat w" style="background-image:url('./Assets/Assets/images/crash.png')">w</button>
      <button class="beat a" style="background-image:url('./Assets/Assets/images/kick.png')">a</button>
      <button class="beat s" style="background-image:url('./Assets/Assets/images/snare.png')">s</button>
      <button class="beat d" style="background-image:url('./Assets/Assets/images/tom1.png')">d</button>
      <button class="beat j" style="background-image:url('./Assets/Assets/images/tom2.png')">j</button>
      <button class="beat k" style="background-image:url('./Assets/Assets/images/tom3.png')">k</button>
      <button class="beat l" style="background-image:url('./Assets/Assets/images/tom4.png')">l</button>
    </div>

    <script>
      // Play sound
      function playSound(key) {
        const sounds = {
          w: "crash.mp3",
          a: "kick-bass.mp3",
          s: "snare.mp3",
          d: "tom-1.mp3",
          j: "tom-2.mp3",
          k: "tom-3.mp3",
          l: "tom-4.mp3",
        };

        if (sounds[key]) {
          let audio = new Audio("./Assets/Assets/sounds/" + sounds[key]);
          audio.play();
        }
      }

      // Animation effect
      function buttonAnimation(key) {
        let active = document.querySelector("." + key);
        if (!active) return;

        active.classList.add("animate");
        setTimeout(() => active.classList.remove("animate"), 180);
      }

      // Click listener
      document.querySelectorAll(".beat").forEach(btn => {
        btn.addEventListener("click", () => {
          let key = btn.innerText;
          playSound(key);
          buttonAnimation(key);
        });
      });

      // Keyboard listener
      document.addEventListener("keydown", event => {
        playSound(event.key);
        buttonAnimation(event.key);
      });
    </script>

  </body>
</html>
